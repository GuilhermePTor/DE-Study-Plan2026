    <span class="fn">risky_operation</span>()
<span class="kw">except</span> <span class="cls">ValueError</span> <span class="kw">as</span> e:
    logger.<span class="fn">warning</span>(<span class="str">"Recoverable: %s"</span>, e)     <span class="cmt"># handle it, don't re-raise</span>
<span class="kw">except</span> <span class="cls">Exception</span>:
    logger.<span class="fn">exception</span>(<span class="str">"Unexpected error"</span>)     <span class="cmt"># logs full traceback</span>
    <span class="kw">raise</span>                                    <span class="cmt"># unexpected errors MUST propagate</span></pre>
<h4>logger.exception() vs logger.error()</h4>
<p><code>logger.error("msg")</code> logs the message only. <code>logger.exception("msg")</code> logs the message <strong>plus the full traceback</strong> automatically — it reads the current exception from <code>sys.exc_info()</code>, so it only makes sense inside an <code>except</code> block.</p>
<pre class="cb"><span class="cmt"># logger.error — message only (no traceback)</span>
<span class="kw">except</span> <span class="cls">ZeroDivisionError</span> <span class="kw">as</span> e:
    logger.<span class="fn">error</span>(<span class="str">"Division failed: %s"</span>, e)
<span class="cmt"># Output: ERROR:app:Division failed: division by zero</span>

<span class="cmt"># logger.exception — message + full traceback (preferred for unexpected errors)</span>
<span class="kw">except</span> <span class="cls">ZeroDivisionError</span>:
    logger.<span class="fn">exception</span>(<span class="str">"Division failed"</span>)
<span class="cmt"># Output: ERROR:app:Division failed</span>
<span class="cmt">#         Traceback ... ZeroDivisionError: division by zero</span>

<span class="cmt"># Rule: exception() for unexpected/debug; error() when traceback is noise</span>
<span class="cmt"># logger.exception() ≡ logger.error("...", exc_info=True)</span></pre>
<h4>Logging levels — hierarchy</h4>
<pre class="cb"><span class="cmt"># DEBUG(10) < INFO(20) < WARNING(30) < ERROR(40) < CRITICAL(50)</span>
<span class="cmt"># Root logger defaults to WARNING — INFO and DEBUG are invisible until configured</span>

logger.<span class="fn">debug</span>(<span class="str">"Config loaded: %s"</span>, config)     <span class="cmt"># dev only — never in prod</span>
logger.<span class="fn">info</span>(<span class="str">"Pipeline started, rows=%d"</span>, n)    <span class="cmt"># normal milestones</span>
logger.<span class="fn">warning</span>(<span class="str">"Retrying after 429: url=%s"</span>, u) <span class="cmt"># unexpected but recoverable</span>
logger.<span class="fn">error</span>(<span class="str">"DB write failed: order=%s"</span>, oid)  <span class="cmt"># operation failed</span>
logger.<span class="fn">critical</span>(<span class="str">"Cannot reach DB, aborting"</span>)    <span class="cmt"># system stability at risk</span>

<span class="cmt"># Always use %s, not f-strings — lazy evaluation skips formatting if level disabled</span>
logger.<span class="fn">debug</span>(<span class="str">"Items: %s"</span>, <span class="fn">len</span>(big_list))   <span class="cmt"># ✅ format only if DEBUG enabled</span>
logger.<span class="fn">debug</span>(<span class="str">f"Items: {len(big_list)}"</span>)    <span class="cmt"># ❌ always evaluates</span>

<span class="cmt"># Suppress noisy third-party libraries:</span>
logging.<span class="fn">getLogger</span>(<span class="str">'urllib3'</span>).<span class="fn">setLevel</span>(logging.WARNING)</pre>
<h4>JSON structured logging — production pattern</h4>
<pre class="cb"><span class="cmt"># pip install python-json-logger</span>
<span class="kw">from</span> pythonjsonlogger <span class="kw">import</span> jsonlogger

handler = logging.<span class="fn">StreamHandler</span>()
handler.<span class="fn">setFormatter</span>(<span class="fn">jsonlogger.JsonFormatter</span>(
    <span class="str">'%(asctime)s %(name)s %(levelname)s %(message)s'</span>
))
logger.<span class="fn">addHandler</span>(handler)

<span class="cmt"># Pass context as extra= dict — each key becomes a top-level JSON field</span>
logger.<span class="fn">info</span>(<span class="str">"Payment processed"</span>,
            extra={<span class="str">'user_id'</span>: <span class="num">42</span>, <span class="str">'amount'</span>: <span class="num">99.99</span>, <span class="str">'duration_ms'</span>: <span class="num">87</span>})
<span class="cmt"># → {"asctime":"2024-01-15","levelname":"INFO","message":"Payment processed",</span>
<span class="cmt">#     "user_id":42,"amount":99.99,"duration_ms":87}</span>
<span class="cmt"># Each field is independently filterable in Datadog / CloudWatch / Splunk</span></pre>`},

  {icon:"✅",title:"Pydantic & Data Validation",tag:"Validation",tagClass:"tag-val",content:`
<p>Pydantic provides runtime data validation using Python type annotations — essential for API responses, configs, and pipeline inputs.</p>
<h4>Basic model</h4>
<pre class="cb"><span class="kw">from</span> pydantic <span class="kw">import</span> BaseModel, Field, field_validator
<span class="kw">from</span> datetime <span class="kw">import</span> datetime
<span class="kw">from</span> typing <span class="kw">import</span> Optional

<span class="kw">class</span> <span class="cls">Order</span>(<span class="cls">BaseModel</span>):
    order_id: int
    amount: float = <span class="fn">Field</span>(gt=<span class="num">0</span>, description=<span class="str">"Must be positive"</span>)
    status: str = <span class="fn">Field</span>(default=<span class="str">'pending'</span>, pattern=<span class="str">r'^(pending|done|failed)$'</span>)
    created_at: datetime
    tags: list[str] = <span class="fn">Field</span>(default_factory=list)

    @<span class="fn">field_validator</span>(<span class="str">'amount'</span>)
    @<span class="fn">classmethod</span>
    <span class="kw">def</span> <span class="fn">round_amount</span>(cls, v):
        <span class="kw">return</span> <span class="bi">round</span>(v, <span class="num">2</span>)

order = <span class="fn">Order</span>(order_id=<span class="str">'42'</span>, amount=<span class="str">'99.999'</span>, created_at=<span class="str">'2024-01-15'</span>)
<span class="cmt"># Pydantic coerces '42' → 42, '99.999' → 100.0, str → datetime</span></pre>
<h4>Serialisation</h4>
<pre class="cb">order.<span class="fn">model_dump</span>()                    <span class="cmt"># dict</span>
order.<span class="fn">model_dump_json</span>()               <span class="cmt"># JSON string</span>
<span class="cls">Order</span>.<span class="fn">model_validate</span>({<span class="str">'order_id'</span>: <span class="num">1</span>, ...})  <span class="cmt"># from dict</span>
<span class="cls">Order</span>.<span class="fn">model_validate_json</span>(json_string)      <span class="cmt"># from JSON</span></pre>
<h4>pydantic-settings for config</h4>
<pre class="cb"><span class="kw">from</span> pydantic_settings <span class="kw">import</span> BaseSettings
<span class="kw">from</span> pydantic <span class="kw">import</span> SecretStr

<span class="kw">class</span> <span class="cls">Settings</span>(<span class="cls">BaseSettings</span>):
    db_host: str
    db_password: <span class="cls">SecretStr</span>
    debug: bool = <span class="kw">False</span>
    model_config = {<span class="str">'env_file'</span>: <span class="str">'.env'</span>}

settings = <span class="fn">Settings</span>()
<span class="bi">print</span>(settings.db_password.<span class="fn">get_secret_value</span>())  <span class="cmt"># access secret</span></pre>
<h4>Validation error handling</h4>
<pre class="cb"><span class="kw">from</span> pydantic <span class="kw">import</span> ValidationError

<span class="kw">try</span>:
    order = <span class="fn">Order</span>(**raw_data)
<span class="kw">except</span> <span class="cls">ValidationError</span> <span class="kw">as</span> e:
    <span class="kw">for</span> err <span class="kw">in</span> e.<span class="fn">errors</span>():
        logger.<span class="fn">error</span>(<span class="str">f"Field {err['loc']}: {err['msg']}"</span>)</pre>
<h4>Type coercion — lax vs strict mode</h4>
<p>Pydantic v2 operates in <strong>lax mode</strong> by default: <code>"42"</code> → <code>42</code>, <code>"true"</code> → <code>True</code>, <code>"3.14"</code> → <code>3.14</code>. Coercion is silent — <code>Order(quantity="5")</code> stores the integer <code>5</code>, not the string <code>"5"</code>. Use <code>ConfigDict(strict=True)</code> to require exact types.</p>
<pre class="cb"><span class="kw">from</span> pydantic <span class="kw">import</span> BaseModel, ConfigDict

<span class="cmt"># Lax mode (default) — coercion succeeds silently</span>
<span class="kw">class</span> <span class="cls">Order</span>(<span class="cls">BaseModel</span>):
    quantity: int
    active: bool

o = <span class="fn">Order</span>(quantity=<span class="str">"5"</span>, active=<span class="str">"true"</span>)
<span class="bi">print</span>(o.quantity)  <span class="cmt"># 5 (int) — silent coercion</span>
<span class="fn">Order</span>(quantity=<span class="str">"five"</span>)   <span class="cmt"># → ValidationError: can't coerce "five" → int</span>

<span class="cmt"># Strict mode — no coercion at all</span>
<span class="kw">class</span> <span class="cls">StrictOrder</span>(<span class="cls">BaseModel</span>):
    model_config = <span class="fn">ConfigDict</span>(strict=<span class="kw">True</span>)
    quantity: int

<span class="fn">StrictOrder</span>(quantity=<span class="str">"5"</span>)  <span class="cmt"># → ValidationError in strict mode</span>
<span class="fn">StrictOrder</span>(quantity=<span class="num">5</span>)   <span class="cmt"># ✅ OK</span></pre>
<h4>@field_validator — custom validation logic</h4>
<p>Use <code>@field_validator</code> for constraints that <code>Field()</code> can't express — cross-referencing a database, normalising a value, or comparing to today's date. Runs <em>after</em> type coercion. Return the (possibly transformed) value, or raise <code>ValueError</code>.</p>
<pre class="cb"><span class="kw">from</span> pydantic <span class="kw">import</span> BaseModel, field_validator
<span class="kw">from</span> datetime <span class="kw">import</span> date

<span class="kw">class</span> <span class="cls">Employee</span>(<span class="cls">BaseModel</span>):
    username:  str
    hire_date: date
    dept:      str

    @<span class="fn">field_validator</span>(<span class="str">'username'</span>)
    @<span class="fn">classmethod</span>   <span class="cmt"># ← required in v2, forgetting it raises RuntimeError</span>
    <span class="kw">def</span> <span class="fn">username_alphanumeric</span>(cls, v: str) -> str:
        <span class="kw">if</span> <span class="kw">not</span> v.<span class="fn">isalnum</span>():
            <span class="kw">raise</span> <span class="cls">ValueError</span>(<span class="str">'must be alphanumeric only'</span>)
        <span class="kw">return</span> v.<span class="fn">lower</span>()    <span class="cmt"># normalise in place — return the value</span>

    @<span class="fn">field_validator</span>(<span class="str">'hire_date'</span>)
    @<span class="fn">classmethod</span>
    <span class="kw">def</span> <span class="fn">not_future</span>(cls, v: date) -> date:
        <span class="kw">if</span> v > date.<span class="fn">today</span>():
            <span class="kw">raise</span> <span class="cls">ValueError</span>(<span class="str">'cannot be in the future'</span>)
        <span class="kw">return</span> v

    <span class="cmt"># One validator for multiple fields:</span>
    @<span class="fn">field_validator</span>(<span class="str">'username'</span>, <span class="str">'dept'</span>)
    @<span class="fn">classmethod</span>
    <span class="kw">def</span> <span class="fn">strip_ws</span>(cls, v: str) -> str:
        <span class="kw">return</span> v.<span class="fn">strip</span>()</pre>
<h4>model_dump — serialisation control</h4>
<pre class="cb">u = <span class="fn">User</span>(id=<span class="num">1</span>, name=<span class="str">"Alice"</span>, password=<span class="str">"secret"</span>, email=<span class="kw">None</span>)

u.<span class="fn">model_dump</span>()                    <span class="cmt"># → full dict including None values</span>
u.<span class="fn">model_dump</span>(exclude={<span class="str">'password'</span>})  <span class="cmt"># → drop sensitive fields</span>
u.<span class="fn">model_dump</span>(exclude_none=<span class="kw">True</span>)     <span class="cmt"># → drop fields whose value is None</span>
u.<span class="fn">model_dump</span>(include={<span class="str">'id'</span>, <span class="str">'name'</span>}) <span class="cmt"># → whitelist specific fields</span>
u.<span class="fn">model_dump_json</span>(exclude={<span class="str">'password'</span>})  <span class="cmt"># → JSON string directly</span>

<span class="cmt"># Aliases: JSON key differs from Python attribute name</span>
<span class="kw">class</span> <span class="cls">Resp</span>(<span class="cls">BaseModel</span>):
    user_id: int = <span class="fn">Field</span>(alias=<span class="str">'userId'</span>)

r = <span class="fn">Resp</span>(userId=<span class="num">5</span>)
r.<span class="fn">model_dump</span>()               <span class="cmt"># {'user_id': 5}  ← Python name</span>
r.<span class="fn">model_dump</span>(by_alias=<span class="kw">True</span>)  <span class="cmt"># {'userId': 5}   ← JSON alias</span></pre>`},

  {icon:"🧪",title:"Testing with pytest",tag:"Quality",tagClass:"tag-test",content:`
<p>pytest is the standard testing framework for Python. Write tests that give you confidence to refactor.</p>
<h4>Basic test structure</h4>
<pre class="cb"><span class="cmt"># test_pipeline.py</span>
<span class="kw">import</span> pytest
<span class="kw">from</span> myapp.pipeline <span class="kw">import</span> calculate_fee, transform_row

<span class="kw">def</span> <span class="fn">test_calculate_fee_normal</span>():
    assert <span class="fn">calculate_fee</span>(<span class="num">100</span>) == <span class="num">10.0</span>

<span class="kw">def</span> <span class="fn">test_calculate_fee_zero</span>():
    assert <span class="fn">calculate_fee</span>(<span class="num">0</span>) == <span class="num">0.0</span>

<span class="kw">def</span> <span class="fn">test_calculate_fee_negative</span>():
    <span class="kw">with</span> pytest.<span class="fn">raises</span>(<span class="cls">ValueError</span>, match=<span class="str">"positive"</span>):
        <span class="fn">calculate_fee</span>(-<span class="num">50</span>)</pre>
<h4>Parametrize — run one test with many inputs</h4>
<pre class="cb">@pytest.mark.<span class="fn">parametrize</span>(<span class="str">"inp,expected"</span>, [
    (<span class="num">100</span>, <span class="num">10.0</span>),
    (<span class="num">0</span>, <span class="num">0.0</span>),
    (<span class="num">1000</span>, <span class="num">100.0</span>),
])
<span class="kw">def</span> <span class="fn">test_fee</span>(inp, expected):
    assert <span class="fn">calculate_fee</span>(inp) == expected</pre>
<h4>Fixtures — reusable setup/teardown</h4>
<pre class="cb">@pytest.<span class="fn">fixture</span>(scope=<span class="str">'session'</span>)  <span class="cmt"># shared across all tests</span>
<span class="kw">def</span> <span class="fn">db</span>():
    engine = <span class="fn">create_test_engine</span>()
    <span class="fn">create_tables</span>(engine)
    <span class="kw">yield</span> engine                  <span class="cmt"># test runs here</span>
    engine.<span class="fn">dispose</span>()              <span class="cmt"># teardown

@pytest.fixture
def sample_df():
    return pd.DataFrame({'id': [1,2], 'amount': [100, 200]})</span></pre>
<h4>Mocking with unittest.mock</h4>
<pre class="cb"><span class="kw">from</span> unittest.mock <span class="kw">import</span> patch, <span class="cls">MagicMock</span>

<span class="kw">def</span> <span class="fn">test_api_call</span>():
    <span class="kw">with</span> <span class="fn">patch</span>(<span class="str">'myapp.client.requests.get'</span>) <span class="kw">as</span> mock_get:
        mock_get.<span class="fn">return_value</span>.<span class="fn">json</span>.<span class="fn">return_value</span> = {<span class="str">'data'</span>: [<span class="num">1</span>,<span class="num">2</span>]}
        mock_get.<span class="fn">return_value</span>.status_code = <span class="num">200</span>
        result = <span class="fn">fetch_data</span>()
    assert result == [<span class="num">1</span>, <span class="num">2</span>]</pre>
<h4>Running tests</h4>
<pre class="cb">pytest                     <span class="cmt"># run all tests</span>
pytest -v                  <span class="cmt"># verbose output</span>
pytest -k "test_fee"       <span class="cmt"># filter by name</span>
pytest --cov=myapp         <span class="cmt"># with coverage</span></pre>
<h4>MagicMock — spec and side_effect</h4>
<p><code>MagicMock</code> auto-generates mocks for any attribute access or method call. Use <code>spec=MyClass</code> to restrict it to the real class's interface — calling a non-existent method raises <code>AttributeError</code>, catching typos at test time.</p>
<pre class="cb"><span class="kw">from</span> unittest.mock <span class="kw">import</span> MagicMock

mock = <span class="fn">MagicMock</span>()
mock.<span class="fn">get_user</span>.<span class="fn">return_value</span> = {<span class="str">'id'</span>: <span class="num">1</span>, <span class="str">'name'</span>: <span class="str">'Alice'</span>}

<span class="cmt"># Raise an exception on call:</span>
mock.<span class="fn">fetch</span>.side_effect = <span class="cls">ConnectionError</span>(<span class="str">"network down"</span>)

<span class="cmt"># Multiple sequential return values:</span>
mock.<span class="fn">read</span>.side_effect = [<span class="str">b'chunk1'</span>, <span class="str">b'chunk2'</span>, <span class="str">b''</span>]

<span class="cmt"># spec — prevents accessing non-existent attributes (catches typos)</span>
<span class="kw">from</span> myapp.services <span class="kw">import</span> UserService
mock_svc = <span class="fn">MagicMock</span>(spec=<span class="cls">UserService</span>)
mock_svc.<span class="fn">nonexistent_method</span>()  <span class="cmt"># ← AttributeError raised at test time</span></pre>
<h4>assert_called_once_with vs assert_called_with</h4>
<p><code>assert_called_with()</code> only checks the <strong>last call</strong> — it passes even if the mock was called 100 times. Always prefer <code>assert_called_once_with()</code> for critical operations (DB writes, emails) to verify exactly one call.</p>
<pre class="cb">m = <span class="fn">MagicMock</span>()
m(<span class="str">'first'</span>)
m(<span class="str">'second'</span>)                        <span class="cmt"># ← this is the last call</span>
m.<span class="fn">assert_called_with</span>(<span class="str">'second'</span>)     <span class="cmt"># ✅ passes (last call matches)</span>
m.<span class="fn">assert_called_once_with</span>(<span class="str">'second'</span>) <span class="cmt"># ❌ FAILS — called twice!</span>

<span class="cmt"># Full family of call assertions:</span>
m.<span class="fn">assert_called</span>()                     <span class="cmt"># was called at all</span>
m.<span class="fn">assert_called_once</span>()                 <span class="cmt"># called exactly once</span>
m.<span class="fn">assert_called_with</span>(args)             <span class="cmt"># last call args only</span>
m.<span class="fn">assert_called_once_with</span>(args)        <span class="cmt"># once AND specific args</span>
m.<span class="fn">assert_not_called</span>()                  <span class="cmt"># never called</span>
<span class="bi">print</span>(m.call_count)                    <span class="cmt"># number of times called</span>
<span class="bi">print</span>(m.call_args_list)                <span class="cmt"># full list of every call</span></pre>
<h4>Fixture scope — choosing the right level</h4>
<pre class="cb"><span class="cmt"># scope='function' (default) — fresh per test → safest, slowest</span>
@pytest.<span class="fn">fixture</span>
<span class="kw">def</span> <span class="fn">db_conn</span>():
    conn = <span class="fn">create_test_db</span>()
    <span class="kw">yield</span> conn
    conn.<span class="fn">rollback</span>()    <span class="cmt"># undo all writes after each test</span>
    conn.<span class="fn">close</span>()

<span class="cmt"># scope='session' — shared across all tests → fast, but mutations carry over!</span>
@pytest.<span class="fn">fixture</span>(scope=<span class="str">'session'</span>)
<span class="kw">def</span> <span class="fn">db_engine</span>():
    engine = <span class="fn">create_engine</span>(TEST_DB_URL)
    <span class="kw">yield</span> engine
    engine.<span class="fn">dispose</span>()   <span class="cmt"># once after all tests</span>

<span class="cmt"># Fixtures compose — a fixture can depend on other fixtures:</span>
@pytest.<span class="fn">fixture</span>
<span class="kw">def</span> <span class="fn">test_user</span>(db_conn):  <span class="cmt"># receives db_conn fixture by name</span>
    user = <span class="cls">User</span>(name=<span class="str">'Alice'</span>)
    db_conn.<span class="fn">add</span>(user)
    <span class="kw">yield</span> user            <span class="cmt"># rollback from db_conn handles cleanup</span></pre>`},

  {icon:"⚙️",title:"Env Variables & Config Management",tag:"Config",tagClass:"tag-config",content:`
<p>Never hardcode secrets. Use environment variables for all config that changes between environments.</p>
<h4>Environment variables</h4>
<pre class="cb"><span class="kw">import</span> os

<span class="cmt"># Required — fails loudly if missing</span>
db_host = os.environ[<span class="str">'DB_HOST'</span>]

<span class="cmt"># Optional with default</span>
port = <span class="bi">int</span>(os.<span class="fn">getenv</span>(<span class="str">'PORT'</span>, <span class="str">'8080'</span>))
debug = os.<span class="fn">getenv</span>(<span class="str">'DEBUG'</span>, <span class="str">'false'</span>).<span class="fn">lower</span>() == <span class="str">'true'</span></pre>
<h4>.env file with python-dotenv</h4>
<pre class="cb"><span class="cmt"># .env file (add to .gitignore!)</span>
<span class="cmt"># DB_HOST=localhost</span>
<span class="cmt"># DB_PASSWORD=secret</span>

<span class="kw">from</span> dotenv <span class="kw">import</span> load_dotenv
<span class="fn">load_dotenv</span>()                  <span class="cmt"># loads .env into os.environ</span>
<span class="fn">load_dotenv</span>(<span class="str">'.env.production'</span>)  <span class="cmt"># load a specific env file</span></pre>
<h4>pydantic-settings (recommended)</h4>
<pre class="cb"><span class="kw">from</span> pydantic_settings <span class="kw">import</span> BaseSettings

<span class="kw">class</span> <span class="cls">Config</span>(<span class="cls">BaseSettings</span>):
    db_host: str
    db_port: int = <span class="num">5432</span>
    api_key: str
    batch_size: int = <span class="num">1000</span>
    model_config = {<span class="str">'env_file'</span>: <span class="str">'.env'</span>}

config = <span class="fn">Config</span>()  <span class="cmt"># validated, typed, one source of truth</span></pre>
<h4>Secrets management in production</h4>
<ul>
  <li><strong>AWS Secrets Manager</strong> — boto3.client('secretsmanager').get_secret_value()</li>
  <li><strong>HashiCorp Vault</strong> — hvac library</li>
  <li><strong>GCP Secret Manager</strong> — google-cloud-secret-manager</li>
  <li><strong>GitHub/GitLab CI Secrets</strong> — injected as env vars at runtime</li>
</ul>
<h4>.gitignore essentials</h4>
<pre class="cb">.env
.env.*
*.pem
*_key.json
secrets/
config/local.py</pre>`},

  {icon:"⏰",title:"Scheduling: Python & Cron Basics",tag:"Orchestration",tagClass:"tag-sched",content:`
<p>Scheduled execution is at the core of every data pipeline. Know cron basics and Python scheduling libraries.</p>
<h4>Cron syntax</h4>
<pre class="cb"><span class="cmt"># ┌─── minute (0–59)</span>
<span class="cmt"># │ ┌─── hour (0–23)</span>
<span class="cmt"># │ │ ┌─── day of month (1–31)</span>
<span class="cmt"># │ │ │ ┌─── month (1–12)</span>
<span class="cmt"># │ │ │ │ ┌─── day of week (0=Sun, 7=Sun)</span>
<span class="cmt"># │ │ │ │ │</span>
  <span class="num">0</span> <span class="num">6</span> * * <span class="num">1</span>-<span class="num">5</span>  <span class="cmt"># 6 AM Mon–Fri</span>
  <span class="num">0</span> <span class="num">0</span> * * *    <span class="cmt"># midnight daily</span>
  <span class="num">*/</span><span class="num">15</span> * * * * <span class="cmt"># every 15 minutes</span>
  <span class="num">0</span> <span class="num">0</span> <span class="num">1</span> * *   <span class="cmt"># first of every month</span></pre>
<h4>crontab commands</h4>
<pre class="cb">crontab -e          <span class="cmt"># edit your crontab</span>
crontab -l          <span class="cmt"># list all cron jobs</span>
crontab -r          <span class="cmt"># remove all cron jobs (careful!)</span>

<span class="cmt"># With logging</span>
<span class="num">0</span> <span class="num">6</span> * * * /usr/bin/python3 /opt/pipeline.py >> /var/log/pipeline.log <span class="num">2</span>&><span class="num">1</span></pre>
<h4>APScheduler — in-process Python scheduler</h4>
<pre class="cb"><span class="kw">from</span> apscheduler.schedulers.blocking <span class="kw">import</span> <span class="cls">BlockingScheduler</span>

scheduler = <span class="fn">BlockingScheduler</span>()

@scheduler.scheduled_job(<span class="str">'cron'</span>, hour=<span class="num">6</span>, day_of_week=<span class="str">'mon-fri'</span>)
<span class="kw">def</span> <span class="fn">daily_etl</span>():
    <span class="fn">run_pipeline</span>()

@scheduler.scheduled_job(<span class="str">'interval'</span>, minutes=<span class="num">15</span>)
<span class="kw">def</span> <span class="fn">heartbeat</span>():
    <span class="fn">check_health</span>()

scheduler.<span class="fn">start</span>()</pre>
<h4>Overlap prevention (file lock)</h4>
<pre class="cb"><span class="kw">import</span> fcntl, sys

lock = <span class="bi">open</span>(<span class="str">'/tmp/pipeline.lock'</span>, <span class="str">'w'</span>)
<span class="kw">try</span>:
    fcntl.<span class="fn">flock</span>(lock, fcntl.LOCK_EX | fcntl.LOCK_NB)
<span class="kw">except</span> <span class="cls">IOError</span>:
    sys.<span class="fn">exit</span>(<span class="str">'Already running'</span>)</pre>
<h4>When to upgrade from cron</h4>
<ul>
  <li>Need retries on failure → Apache Airflow, Prefect, Dagster</li>
  <li>Need job dependencies (A runs after B) → orchestrators</li>
  <li>Need monitoring dashboard → orchestrators</li>
  <li>Need backfill (re-run historical dates) → orchestrators</li>
  <li>Simple, single-machine, no dependencies → cron is fine</li>
</ul>`}
];

let current = 0;
let score = 0;
let correct = 0;
let streak = 0;
let answered = false;
const catScores = {};
const catTotals = {};
QUESTIONS.forEach(q => { catTotals[q.cat] = (catTotals[q.cat]||0) + 1; catScores[q.cat] = catScores[q.cat]||0; });

function catClass(cat) {
  const m = {
    'File I/O':'cat-fileio','CSV':'cat-csv','JSON':'cat-json','Parquet':'cat-parquet',
    'Pandas':'cat-pandas','DB / psycopg':'cat-db','APIs':'cat-api',
    'Error Handling':'cat-errors','Pydantic':'cat-pydantic','Testing':'cat-testing',
    'Config':'cat-config','Scheduling':'cat-sched'
  };
  return m[cat]||'cat-fileio';
}

function renderQuestion() {
  const q = QUESTIONS[current];
  answered = false;
  document.getElementById('qnum').textContent = `Question ${current+1} of ${QUESTIONS.length}`;
  const badge = document.getElementById('qbadge');
  badge.textContent = q.cat;
  badge.className = `cbadge ${catClass(q.cat)}`;
  document.getElementById('qtxt').textContent = q.q;
  const codeEl = document.getElementById('qcode');
  if (q.code) {
    codeEl.innerHTML = syntaxHL(q.code);
    codeEl.style.display = 'block';
  } else {
    codeEl.style.display = 'none';
  }
  const optsEl = document.getElementById('opts');
  optsEl.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="ol">${letters[i]}</span><span>${escapeHTML(opt)}</span>`;
    btn.onclick = () => selectAnswer(i);
    optsEl.appendChild(btn);
  });
  document.getElementById('fb').style.display = 'none';
  document.getElementById('fb').className = 'fb';
  document.getElementById('tip').style.display = 'none';
  document.getElementById('nxtbtn').style.display = 'none';
  document.getElementById('qcard').style.display = 'block';
  document.getElementById('results').style.display = 'none';
  updateProgress();
}

function escapeHTML(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function syntaxHL(code) {
  const keywords = ['import','from','as','def','class','return','with','for','in','if','elif','else','while','try','except','finally','raise','yield','pass','break','continue','and','or','not','is','lambda','True','False','None','self','cls','await','async'];
  const builtins = ['print','open','len','range','int','float','str','list','dict','tuple','set','bool','type','isinstance','super','round','any','all','zip','enumerate','map','filter','sorted','reversed'];
  const decorators = ['@pytest','@scheduler','@classmethod','@staticmethod','@property','@field_validator'];

  let h = escapeHTML(code);
  // comments
  h = h.replace(/#[^\n]*/g, m => `<span class="cmt">${m}</span>`);
  // strings (single, double, f-strings)
  h = h.replace(/(f?)("""[\s\S]*?"""|'''[\s\S]*?'''|"[^"\n]*"|'[^'\n]*')/g, (m, fp, s) => `<span class="str">${fp}${s}</span>`);
  // decorators
  decorators.forEach(d => {
    const esc = d.replace('@','@');
    h = h.replace(new RegExp(esc + '[a-zA-Z_.]*', 'g'), m => `<span class="dec">${m}</span>`);
  });
  // keywords
  keywords.forEach(kw => {
    h = h.replace(new RegExp(`\\b(${kw})\\b`, 'g'), '<span class="kw">$1</span>');
  });
  // builtins
  builtins.forEach(bi => {
    h = h.replace(new RegExp(`\\b(${bi})\\b`, 'g'), '<span class="bi">$1</span>');
  });
  // class names (CamelCase)
  h = h.replace(/\b([A-Z][a-zA-Z0-9]+)\b/g, '<span class="cls">$1</span>');
  // function calls
  h = h.replace(/\b([a-z_][a-zA-Z0-9_]*)(\s*\()/g, '<span class="fn">$1</span>$2');
  // numbers
  h = h.replace(/\b(\d[\d_]*\.?\d*)\b/g, '<span class="num">$1</span>');
  return h;
}

function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = QUESTIONS[current];
  const btns = document.querySelectorAll('.opt');
  btns.forEach(b => b.disabled = true);
  const isCorrect = idx === q.ans;
  if (isCorrect) {
    btns[idx].classList.add('correct');
    score += 10;
    correct++;
    streak++;
    catScores[q.cat] = (catScores[q.cat]||0) + 1;
  } else {
    btns[idx].classList.add('wrong');
    btns[q.ans].classList.add('revealed');
    streak = 0;
  }
  document.getElementById('scoreVal').textContent = score;
  document.getElementById('correctVal').textContent = correct;
  document.getElementById('streakVal').textContent = streak;
  const fb = document.getElementById('fb');
  fb.className = `fb ${isCorrect?'ok':'bad'}`;
  fb.innerHTML = `<strong>${isCorrect?'✓ Correct!':'✗ Incorrect'}</strong> — ${escapeHTML(q.exp)}`;
  fb.style.display = 'block';
  const tip = document.getElementById('tip');
  document.getElementById('tipTxt').textContent = q.tip;
  tip.style.display = 'block';
  document.getElementById('nxtbtn').style.display = 'inline-block';
  document.getElementById('nxtbtn').textContent = current < QUESTIONS.length - 1 ? 'Next Question →' : 'See Results →';
}

function nextQuestion() {
  current++;
  if (current >= QUESTIONS.length) {
    showResults();
  } else {
    renderQuestion();
  }
}

function updateProgress() {
  const pct = Math.round((current / QUESTIONS.length) * 100);
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progTxt').textContent = `${current} / ${QUESTIONS.length}`;
}

function showResults() {
  document.getElementById('qcard').style.display = 'none';
  const res = document.getElementById('results');
  res.style.display = 'block';
  const pct = Math.round((correct / QUESTIONS.length) * 100);
  document.getElementById('rScore').textContent = pct + '%';
  let grade, msg;
  if (pct >= 90) { grade = '🏆 Python Master'; msg = 'Outstanding! You have expert-level Python data engineering knowledge.'; }
  else if (pct >= 75) { grade = '⭐ Advanced'; msg = 'Great work! You have strong Python DE skills. Review the Concepts tab for any gaps.'; }
  else if (pct >= 60) { grade = '📈 Intermediate'; msg = 'Solid foundation! Focus on testing, Pydantic, and database patterns to level up.'; }
  else if (pct >= 40) { grade = '🌱 Developing'; msg = 'Good start! Study the Concepts tab and practice file I/O, pandas, and error handling.'; }
  else { grade = '📚 Beginner'; msg = 'Keep going! Start with file I/O and CSV basics, then progress to pandas and databases.'; }
  document.getElementById('rGrade').textContent = grade;
  document.getElementById('rMsg').textContent = `${correct} of ${QUESTIONS.length} correct · ${msg}`;
  const br = document.getElementById('rBreak');
  br.innerHTML = '';
  Object.keys(catTotals).forEach(cat => {
    const c = catScores[cat]||0;
    const t = catTotals[cat];
    const div = document.createElement('div');
    div.className = 'rbi';
    div.innerHTML = `<div class="rbn">${escapeHTML(cat)}</div><div class="rbs" style="color:${c/t>=0.7?'var(--correct)':c/t>=0.4?'var(--accent-y)':'var(--wrong)'}">${c}/${t}</div>`;
    br.appendChild(div);
  });
}

function restartQuiz() {
  current = 0; score = 0; correct = 0; streak = 0;
  Object.keys(catScores).forEach(k => catScores[k] = 0);
  document.getElementById('scoreVal').textContent = 0;
  document.getElementById('correctVal').textContent = 0;
  document.getElementById('streakVal').textContent = 0;
  renderQuestion();
}

function showSection(s) {
  document.getElementById('quiz').style.display = s==='quiz'?'block':'none';
  document.getElementById('docs').style.display = s==='docs'?'block':'none';
  document.querySelectorAll('.nb').forEach((b,i) => b.classList.toggle('on', (i===0&&s==='quiz')||(i===1&&s==='docs')));
  if (s==='docs' && !document.getElementById('docContent').innerHTML.trim()) renderDocs();
}

function renderDocs() {
  const el = document.getElementById('docContent');
  el.innerHTML = DOCS.map((d,i) => `
    <div class="dcard">
      <div class="dh" onclick="toggleDoc(${i})">
        <span class="di">${d.icon}</span>
        <span class="dt">${d.title}</span>
        <span class="dtag ${d.tagClass}">${d.tag}</span>
        <span class="tog" id="tog${i}">▼</span>
      </div>
      <div class="db" id="db${i}">${d.content}</div>
    </div>
  `).join('');
}

function toggleDoc(i) {
  const db = document.getElementById(`db${i}`);
  const tog = document.getElementById(`tog${i}`);
  const dh = db.previousElementSibling;
  const isOpen = db.classList.contains('open');
  db.classList.toggle('open', !isOpen);
  tog.classList.toggle('open', !isOpen);
  dh.classList.toggle('open', !isOpen);
}

renderQuestion();
</script>
